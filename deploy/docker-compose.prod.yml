# Proyecto de Compose propio: sin `name`, Compose usa el nombre de la carpeta (`prod`), que en
# Contabo comparten PH v2 e Iurivia, y un `--remove-orphans` borraría sus contenedores.
name: belopia-prod

services:
  belopia-backend-prod:
    image: adrianpuche/belopia-backend:latest
    container_name: belopia-backend-prod
    restart: unless-stopped
    ports:
      - "8110:8080"
    env_file: .env
    # Rotación propia (el daemon del servidor compartido trae 100m y 1 archivo): 5 x 20 MB.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
