# Proyecto de Compose propio: sin `name`, Compose usa el nombre de la carpeta (`dev`), que en
# Contabo comparten PH v2 e Iurivia, y un `--remove-orphans` borraría sus contenedores.
name: belopia-dev

services:
  belopia-backend-dev:
    image: adrianpuche/belopia-backend:dev-latest
    container_name: belopia-backend-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:8111:8080"   # solo nginx (dev-api.belopia.app) lo alcanza
    env_file: .env
    # Rotación propia (el daemon del servidor compartido trae 100m y 1 archivo): 5 x 20 MB.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
