# Mejora continua v4 (k6): ambiente DESCARTABLE para pruebas de carga de Belopia.
# Corre solo en el runner de GitHub Actions (load.yml) o en un docker local, con tests/load/ambiente/levantar.sh.
# No toca ningun servidor: base, Keycloak y almacenamiento propios, en una red de Docker SIN salida a internet
# (internal: true) y sin puertos publicados. k6 corre como contenedor dentro de la misma red.
# Las claves salen de tests/load/.generado/load.env (las genera levantar.sh en cada corrida; .generado esta en
# .gitignore). Ninguna clave en el repo.
# Limites de CPU y memoria: a confirmar con el contenedor real (hoy DEV y PROD corren sin limites ni -Xmx).

name: belopia-load

networks:
  carga:
    internal: true

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: belopia_owner
      POSTGRES_PASSWORD: ${DB_MIGRATION_PASSWORD:?falta load.env}
      POSTGRES_DB: belopia_load
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?falta load.env}
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=128MB"]
    volumes:
      - ./tests/load/ambiente/postgres-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
      - ./tests/load/ambiente:/semilla:ro
      - ./tests/load/.generado:/generado:ro
    networks: [carga]
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U belopia_owner -d belopia_load"]
      interval: 3s
      timeout: 3s
      retries: 40

  keycloak:
    # realm belopia-load generado por generar_usuarios.py (usuarios sinteticos @belopia.test), nunca exportado
    # de un servidor. Nada que ver con el Keycloak compartido con PH v2.
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?falta load.env}
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: WARN
      JAVA_OPTS_KC_HEAP: "-Xms256m -Xmx640m"
    volumes:
      - ./tests/load/.generado/realm-belopia-load.json:/opt/keycloak/data/import/realm-belopia-load.json:ro
    networks: [carga]
    mem_limit: 1g
    cpus: 1.0

  minio:
    # En lugar de R2: los escenarios no suben archivos, pero el backend arranca con un S3 propio y nunca con R2.
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?falta load.env}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?falta load.env}
    networks: [carga]
    mem_limit: 256m
    cpus: 0.25

  backend:
    build: ./PH
    image: belopia-backend:load
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: load
      DB_URL: jdbc:postgresql://postgres:5432/belopia_load
      DB_USER: belopia_load_app
      DB_PASSWORD: ${DB_APP_PASSWORD}
      DB_MIGRATION_USER: belopia_owner
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: belopia-load
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      ALLOWED_AZP: klaro-frontend
      R2_ACCOUNT_ID: load
      R2_ACCESS_KEY_ID: ${MINIO_USER}
      R2_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
      R2_BUCKET_NAME: belopia-load
      R2_ENDPOINT: http://minio:9000
      R2_PUBLIC_URL: http://minio:9000/belopia-load
      R2_FOLDER_PREFIX: load
      SENTRY_DSN: ""
      # Rate limit: ALTO por defecto para los escenarios de capacidad (pos-concurrencia, idempotencia).
      # rate-limit.js (PR 4) corre con los de PROD: LOAD_RATE_LIMIT_PROD=1 en levantar.sh.
      RATE_LIMIT_USER_PER_MIN: ${LOAD_RATE_LIMIT_USER_PER_MIN:-1000000}
      RATE_LIMIT_ANON_IP_PER_MIN: ${LOAD_RATE_LIMIT_ANON_IP_PER_MIN:-1000000}
      RATE_LIMIT_IP_CEILING_PER_MIN: ${LOAD_RATE_LIMIT_IP_CEILING_PER_MIN:-1000000}
      LOAD_DB_POOL_MAX: ${LOAD_DB_POOL_MAX:-10}
      LOAD_DB_POOL_MIN: ${LOAD_DB_POOL_MIN:-10}
      # -Xmx explicito (a confirmar): el contenedor real no tiene limite hoy. La imagen respeta JAVA_TOOL_OPTIONS.
      JAVA_TOOL_OPTIONS: ${LOAD_JAVA_OPTS:--Xms256m -Xmx640m -XX:+ExitOnOutOfMemoryError}
    networks: [carga]
    mem_limit: ${LOAD_BACKEND_MEM:-1g}
    cpus: ${LOAD_BACKEND_CPUS:-1.5}

  k6:
    image: grafana/k6:0.54.0
    profiles: ["k6"]
    working_dir: /scripts
    environment:
      BASE_URL: http://backend:8080
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: belopia-load
      LOAD_USER_PASSWORD: ${LOAD_USER_PASSWORD}
      K6_NO_USAGE_REPORT: "true"
      RESULTADOS: /resultados
    volumes:
      - ./tests/load:/scripts:ro
      - ./tests/load/resultados:/resultados
    networks: [carga]
    cpus: 1.0
