# Configuración PRODUCCIÓN v2 — NeonDB (PostgreSQL)

# NeonDB connection (variables de entorno en producción)
# Formato: jdbc:postgresql://[host].neon.tech/[database]?sslmode=require
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# PRODUCCIÓN: validate — el schema lo maneja Flyway (db/migration/), nunca ddl-auto
# (ver SPRINT-08B: ddl-auto=update causó pérdida de schema en PH v2, DT-01)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Keycloak Admin API — service account belopia-admin del realm klaro-prod (sin default de secreto)
keycloak.admin.url=${KEYCLOAK_URL:https://keycloak.belopia.app}
keycloak.admin.realm=${KEYCLOAK_REALM:klaro-prod}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:belopia-admin}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}


# CORS — solo origen PROD
cors.allowed-origins=https://app.belopia.app

# Sentry producción
sentry.environment=production

# Logging producción
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.cors=INFO
logging.level.org.springframework.web.filter=INFO
logging.level.root=INFO
