spring.application.name=klaro-backend

# Perfil activo por defecto. En Railway se sobreescribe con SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=local

# DataSource — usa variables de entorno si existen
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Eureka deshabilitado
eureka.client.enabled=false

# Keycloak Admin API — credenciales para gestión de usuarios
keycloak.admin.url=${KEYCLOAK_URL:http://62.171.160.238:8095}
keycloak.admin.realm=${KEYCLOAK_REALM:klaro-dev}
keycloak.admin.username=${KEYCLOAK_ADMIN_USER:admin}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:GeronimoAdmin2024!}


# Cloudflare R2 — storage de comprobantes
r2.account-id=${R2_ACCOUNT_ID}
r2.access-key=${R2_ACCESS_KEY_ID}
r2.secret-key=${R2_SECRET_ACCESS_KEY}
r2.bucket=${R2_BUCKET_NAME}
r2.endpoint=${R2_ENDPOINT}
r2.public-url=${R2_PUBLIC_URL}
r2.folder-prefix=${R2_FOLDER_PREFIX:local}

# Multipart — permitir uploads de hasta 10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.cors=DEBUG
logging.level.org.springframework.web.filter=DEBUG
