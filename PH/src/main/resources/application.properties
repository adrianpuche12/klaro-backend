spring.application.name=klaro-backend

# Perfil activo por defecto. En Railway se sobreescribe con SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=local

# DataSource — usa variables de entorno si existen
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA — el schema lo maneja Flyway (db/migration/), Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate

# Flyway migra con el dueño de las tablas (no sujeto a RLS). La app se conecta
# con DB_USER, que en DEV/PROD debe ser el rol de aplicación <base>_app (V11).
# Sin DB_MIGRATION_USER, Flyway usa DB_USER (comportamiento anterior a V11).
spring.flyway.url=${DB_URL}
spring.flyway.user=${DB_MIGRATION_USER:${DB_USER}}
spring.flyway.password=${DB_MIGRATION_PASSWORD:${DB_PASSWORD}}
# Sin SQL en el log por defecto (ruido y datos de negocio en los logs). Activar a mano en local si hace falta.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Eureka deshabilitado
eureka.client.enabled=false

# Keycloak Admin API — service account del propio realm (cliente confidencial
# belopia-admin con manage-users/view-users/query-users/view-realm). Nunca el admin de
# master: el Keycloak es compartido con otros productos.
# Sin valor por defecto a propósito: si falta KEYCLOAK_ADMIN_CLIENT_SECRET el backend no arranca.
keycloak.admin.url=${KEYCLOAK_URL:https://keycloak.belopia.app}
keycloak.admin.realm=${KEYCLOAK_REALM:klaro-dev}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:belopia-admin}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}

# Spring Security — validación JWT contra Keycloak
# El issuer-uri apunta al realm actual.
# Spring descarga el JWKS automáticamente desde {issuer-uri}/.well-known/openid-configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_URL:https://keycloak.belopia.app}/realms/${KEYCLOAK_REALM:klaro-dev}
# Clientes de Keycloak cuyos tokens acepta la API (claim azp), separados por comas.
# Si otro cliente necesita llamar a la API (ej. un E2E con su propio client), agregarlo acá.
app.security.allowed-azp=${ALLOWED_AZP:klaro-frontend}


# Cloudflare R2 — storage de comprobantes
r2.account-id=${R2_ACCOUNT_ID}
r2.access-key=${R2_ACCESS_KEY_ID}
r2.secret-key=${R2_SECRET_ACCESS_KEY}
r2.bucket=${R2_BUCKET_NAME}
r2.endpoint=${R2_ENDPOINT}
r2.public-url=${R2_PUBLIC_URL}
r2.folder-prefix=${R2_FOLDER_PREFIX:local}

# Multipart — permitir uploads de hasta 10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.cors=INFO
logging.level.org.springframework.web.filter=INFO

# CORS — orígenes permitidos (coma-separados). Sobreescribir en dev/prod properties.
cors.allowed-origins=http://localhost:8081,http://localhost:19006,http://localhost:3000

# Sentry — deshabilitado por defecto (se activa vía SENTRY_DSN en Railway)
sentry.dsn=${SENTRY_DSN:}
# 10% de las transacciones: 1.0 agota la cuota gratis de Sentry.
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.1}

# Detrás de nginx: la IP del cliente sale de X-Forwarded-For SOLO si la conexión viene de
# un proxy interno (RemoteIpValve de Tomcat: 127/8, 10/8, 172.16/12, 192.168/16).
# Un X-Forwarded-For inventado por el cliente no cambia la IP (ver RateLimitingFilter).
server.forward-headers-strategy=native

# Rate limit (mejora continua v4, aprobado por Jorge el 07-Nov-2026). Ver RateLimitingFilter.
# Con token: por usuario (sub del JWT ya validado). Sin token: por IP. Techo: por IP, todos los pedidos.
# Si la variable de entorno falta, se usan estos valores (DEV y PROD arrancan igual sin tocar nada).
app.rate-limit.user-per-min=${RATE_LIMIT_USER_PER_MIN:300}
app.rate-limit.anon-ip-per-min=${RATE_LIMIT_ANON_IP_PER_MIN:100}
app.rate-limit.ip-ceiling-per-min=${RATE_LIMIT_IP_CEILING_PER_MIN:1000}

# Mejora continua v4 (k6): el registro Prometheus está en el classpath pero apagado. Solo el perfil
# load lo prende y abre /actuator/prometheus dentro de la red interna del ambiente descartable.
management.prometheus.metrics.export.enabled=false
app.metrics.prometheus-interno=false
