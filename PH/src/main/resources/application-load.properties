# ===========================================
# Perfil load: ambiente DESCARTABLE para pruebas de carga con k6 (mejora continua, vuelta 4).
# Corre SOLO dentro del runner de GitHub Actions o en un docker local (docker-compose.load.yml):
# Postgres, Keycloak y un S3 de prueba propios, en una red de Docker sin salida a internet y sin puertos
# publicados. Nunca apuntar este perfil a belopia-postgres, al Keycloak compartido ni a R2.
# DEV y PROD no cambian: todo lo de acá vive solo en este perfil.
# ===========================================

# Base propia (docker-compose.load.yml). La app conecta con el rol <base>_app (sin BYPASSRLS):
# RLS aplica de verdad. Flyway migra desde cero con el dueño (DB_MIGRATION_USER).
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/belopia_load}
spring.flyway.url=${DB_URL:jdbc:postgresql://postgres:5432/belopia_load}

# Pool Hikari: por defecto el de Spring Boot (10), el mismo que DEV y PROD hoy (no configuran
# spring.datasource.hikari.*). Se cambia por variable para probar otro tamaño sin tocar código.
spring.datasource.hikari.maximum-pool-size=${LOAD_DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${LOAD_DB_POOL_MIN:10}

# CORS sin uso (k6 no es un navegador); un origen inexistente
cors.allowed-origins=http://belopia-load.invalid

# Logs INFO, sin SQL (con carga el log mide otra cosa)
logging.level.root=INFO
logging.level.org.springframework.web=INFO
spring.jpa.show-sql=false

# ---- Terceros apagados (y además la red del backend no tiene salida) ----
# Sentry: sin DSN no manda nada
sentry.dsn=
# Swagger apagado (como PROD)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
# R2 reemplazado por el S3 de prueba del compose (r2.* sale de R2_* del compose). Los escenarios no suben archivos.

# ---- Métricas del servidor (solo acá) ----
# /actuator/prometheus abierto SOLO en este perfil: el backend no publica puertos y su red no tiene salida.
management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true
app.metrics.prometheus-interno=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=belopia-load
