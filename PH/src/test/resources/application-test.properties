cors.allowed-origins=http://localhost:8081
eureka.client.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# En tests: deshabilitar JWT resource server para que @WithMockUser funcione
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
spring.security.oauth2.resourceserver.jwt.issuer-uri=

# R2/S3 — valores dummy para tests (no se hacen llamadas reales)
r2.account-id=test-account
r2.access-key=test-key
r2.secret-key=test-secret
r2.bucket=test-bucket
r2.endpoint=https://test.r2.example.com
r2.public-url=https://test.r2.example.com
r2.folder-prefix=test
