name: Secretos (gitleaks)

# Los repos son públicos: ningún commit nuevo puede traer credenciales.
# Escanea solo los commits del PR / del push (el historial viejo ya se trata rotando
# las credenciales expuestas, ver vault: MEJORA CONTINUA / Rotar la credencial master).
on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
