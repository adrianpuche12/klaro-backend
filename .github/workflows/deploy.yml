name: CI/CD — Klaro Backend

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # verify = unitarios (Surefire, *Test) + integración (Failsafe, *IT: repositorios con
      # Testcontainers, HTTP entre empresas y matriz de permisos). Docker viene en el runner.
      - name: Compilar y ejecutar tests (unitarios + integración)
        working-directory: ./PH
        run: mvn clean verify -B -e
        env:
          DB_URL: ${{ secrets.DB_URL_DEV }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      - name: Resumen de tests
        if: always()
        working-directory: ./PH
        run: |
          {
            echo "### Tests"
            echo "| Tipo | Clases | Tests | Fallas | Errores | Salteados |"
            echo "|---|---|---|---|---|---|"
            for tipo in surefire failsafe; do
              dir="target/${tipo}-reports"
              [ -d "$dir" ] || continue
              t=0; f=0; e=0; s=0; n=0
              for x in "$dir"/TEST-*.xml; do
                [ -f "$x" ] || continue
                n=$((n+1))
                h=$(grep -o '<testsuite [^>]*>' "$x" | head -1)
                t=$((t+$(echo "$h" | sed -E 's/.* tests="([0-9]+)".*/\1/')))
                f=$((f+$(echo "$h" | sed -E 's/.* failures="([0-9]+)".*/\1/')))
                e=$((e+$(echo "$h" | sed -E 's/.* errors="([0-9]+)".*/\1/')))
                s=$((s+$(echo "$h" | sed -E 's/.* skipped="([0-9]+)".*/\1/')))
              done
              echo "| $tipo | $n | $t | $f | $e | $s |"
            done
            echo
            echo "Integración (*IT):"
            ls target/failsafe-reports/TEST-*.xml 2>/dev/null | sed -E 's|.*/TEST-balance\.||; s|\.xml$||; s|^|- |'
          } >> "$GITHUB_STEP_SUMMARY"
      # Sin subir los reportes como artifact a propósito: el repo es público y la salida
      # capturada de los tests no pasa por el enmascarado de secrets de Actions.

  build-and-deploy:
    name: Build imagen y deploy a Contabo
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Un solo deploy por rama a la vez, y el más nuevo cancela al anterior. Sin esto, varios
    # merges seguidos publican la misma etiqueta (dev-latest / latest) en paralelo y gana el
    # que TERMINA último, que puede ser un commit viejo (pasó el 01-Nov con #22/#23/#24).
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: true

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      # Cada imagen sale con dos etiquetas: la "móvil" que usa el compose (latest / dev-latest) y la
      # del commit (sha-<7>), que es la que se despliega y permite volver atrás.
      - name: Determinar tag de imagen
        id: vars
        run: |
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "amb=prod" >> "$GITHUB_OUTPUT"
            echo "puerto=8110" >> "$GITHUB_OUTPUT"
            echo "compose_dir=/opt/belopia/prod" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-latest" >> "$GITHUB_OUTPUT"
            echo "amb=dev" >> "$GITHUB_OUTPUT"
            echo "puerto=8111" >> "$GITHUB_OUTPUT"
            echo "compose_dir=/opt/belopia/dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build y push imagen
        uses: docker/build-push-action@v5
        with:
          context: ./PH
          push: true
          tags: |
            adrianpuche/belopia-backend:${{ steps.vars.outputs.tag }}
            adrianpuche/belopia-backend:${{ steps.vars.outputs.sha_tag }}
          # desplegar.sh limpia solo las imágenes sin etiqueta que tengan este label (servidor compartido).
          labels: |
            org.opencontainers.image.title=belopia-backend
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Copiar script de deploy al servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: deploy/ci/desplegar.sh
          target: ${{ steps.vars.outputs.compose_dir }}
          strip_components: 2

      # Chequeo de salud y rollback automático: si /actuator/health no da UP en 90 s, vuelve a la
      # imagen anterior y el job queda en rojo (GitHub avisa por mail). Ver deploy/ci/desplegar.sh.
      - name: Deploy en Contabo (SSH) con chequeo de salud y rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            cd ${{ steps.vars.outputs.compose_dir }}
            bash desplegar.sh ${{ steps.vars.outputs.amb }} adrianpuche/belopia-backend:${{ steps.vars.outputs.sha_tag }} ${{ steps.vars.outputs.puerto }}
