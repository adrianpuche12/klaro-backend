name: CI — Klaro Backend

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar y ejecutar tests
        working-directory: ./PH
        run: mvn clean test -B
        env:
          DB_URL: ${{ secrets.DB_URL_DEV }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

# Deploy: Railway lo maneja automáticamente desde GitHub
# develop → Railway DEV service
# main    → Railway PROD service
# No se necesita step de deploy aquí.
